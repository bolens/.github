name: Reusable source lint
on:
  workflow_call:
    inputs:
      tooling-ref:
        description: Immutable bolens/.github commit matching this workflow
        type: string
        required: true
permissions:
  contents: read
jobs:
  lint:
    name: Source lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
      - name: Validate tooling revision
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bolens/.github
          ref: ${{ inputs.tooling-ref }}
          persist-credentials: false
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version: '0.15.20'
          args: --version
      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          npm ci --ignore-scripts --prefix tooling/tools/source-lint
      - name: Lint maintained source
        run: python3 tooling/scripts/lint-source.py source
