name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  workflows:
    uses: ./.github/workflows/reusable-actionlint.yml
    with:
      security-audit: true

  spec-kit:
    name: Spec Kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Spec Kit
        run: python3 scripts/validate-spec-kit.py .
